components:

  - id: "accordion"
    desc: "Organize content into expandable and collapsible sections, allowing users to reveal or hide information as needed."
    path: "accordion"
    title: "Accordion"
    version: "2.9.4" 
    examples: 

      - name: "Default Setup"
        id: "default"
        note: "Please note that this is a basic example of accordion functionality. Adding additional markup, such as headings, can enhance the component's accessibility and make it more understandable to assistive technology users. See the <a href='#headings'>Interactive Headings (FAQ)</a> example for more details."

      - name: "Animation"
        id: "animation"
        message: 
        
          - use-tablist
          - starting-style
      
      - name: "Default Opened"
        id: "default-opened"
        note: "Please note that only one accordion may be opened on page load. This content can be closed and should not be confused with the <a href='../tablist/'>TabList</a>, which may never have collapsed content."

      - name: "Enable Anchor"
        id: "enable-anchor"
        note: "In this demo, selecting a disclosure adds an anchor to the URL. Each disclosure can be configured with a unique anchor. Anchors make it easier to link directly to specific content, share specific sections of the page, and track user interactions."

      - name: "Fixed Height"
        id: "fixed-height"
        guidance: a11y-scrollbars

      - name: "Default (Horizontal)"
        id: "horizontal"
        group: Horizontal Layout
        message: use-tablist

      - name: "Content Pointer"
        id: "horizontal-pointer"
        group: Horizontal Layout
        message: 

          - use-tablist

      - name: "Interactive Headings (FAQ)"
        id: "headings"
        note: 'In this example, take note of the headings used to wrap the <code>button</code> elements, creating a more logical, interactive, and navigable structure for assistive technology users. Default list markup is also present to help convey the number of accordion items there are, and wrapping the accordion in a <code>section</code> element connected to the "My FAQ" heading via <code>aria-labelledby</code> creates a landmark region for the grouping. Together, these techniques improve the overall understanding of the component for users with certain disabilities, specifically blind and low vision users. Please watch the <a href="headings.mp4">demo</a> to see this behavior in action.'
        
      - name: "Multiple Open"
        id: "multiple-open"
        note: "Ideally, only one accordion section should be open at a time. However, there may be cases where allowing multiple sections to be open simultaneously is desirable, such as when a user wants to compare or search through the content."

      - name: "Toggle All"
        id: "toggle-all"

      - name: "Viewport Context"
        id: "viewport-context"
        note: "In some scenarios, we may only want the accordion to be present on smaller viewports. In such cases, it is crucial to ensure that accessibility on larger screens is not compromised by leaving buttons accessible to assistive technologies. To see this solution in action, try pressing or tabbing to the headings in larger viewport sizes. As you'll notice, the headings are not interactive and all content that would normally be collapsed is revealed, which is exactly what we want. However, when you change the viewport to a smaller size, the component then becomes a traditional accordion. This kind of behavior can often be found in the footer of applications or website, where space is more limited on smaller screens."
        message: button-removal

      - name: "Overlay"
        id: "horizontal-overlay"
        group: Experimental
        message: 
        
          - experimental
          - use-tablist

  - id: "animation-toggle"
    desc: "Allow users to pause or resume web animations, videos, or other dynamic content for improved control and accessibility."
    path: "animation-toggle"
    title: "Animation Toggle"
    version: "2.9.0"
    examples:

      - name: "Default Setup"
        id: "default-setup"
        group: Video

      - name: "After Effects (Callback)"
        id: "callback"
        group: Non-Video
        codepenjs: "https://radancy.dev/component-library/animation-toggle/callback-lottie.js"
        customcss: "callback-custom"
        customjs: "callback-custom.js"

      - name: "CSS Animation"
        id: "css-animation"
        group: Non-Video
        customcss: "css-animation"

      - name: "Custom Loop"
        id: "custom-loop"
        group: Video
        note: "In this example, the video is set to loop one time. Once complete, it cannot be restarted."

      - name: "Audio Description"
        id: "audio-description"
        group: Experimental
        experimental: "This is an experimental feature that will allow the video to include an audio description. A valid, third-party or self-produced <a href='demo.vtt'>VTT</a> file is required."
      
      - name: "GIF Animation"
        id: "gif-animation"
        group: Non-Video
        customcss: "gif-animation"
        note: 'To "pause" an animated GIF, you will need two images: the animated version and a static version, which can be any desired frame. Animated GIFs should only be used as a last resort when video is not a viable option.'

      - name: "Hero Banner (Video)"
        id: "hero-banner"
        group: Video

      - name: "Multiple Videos"
        id: "multiple-videos"
        group: Video
        customcss: "multiple-videos"

      - name: "No Pause Button"
        id: "no-pause-button"
        group: Video
        warning: In some situations, it may be desirable to remove a pause button but still have animation benefit from cookie setting enabled in videos that do contain a pause button. This is not a feature that should be used lightly.

      - name: "Poster (Fallback Image)"
        id: "poster"
        group: Video
        note: "Pause the video and then refresh the page. The first frame is from 25 seconds in. Please note that when pressing play, video will resume from this point."

      - name: "Responsive (Media Queries)"
        id: "responsive"
        group: Video
        note: "Resize your browser window and refresh page. Loading alternatively sized and/or video formats to improve layout and performance is fully supported."

      - name: "SVG Animation"
        id: "svg-animation"
        group: Non-Video
        customcss: "svg-animation"

      - name: "Transparent Video"
        id: "transparent"
        group: Demo
        customcss: "transparent"
        customjs: "transparent.js"
        note: This video utilizes an <a href="https://developer.mozilla.org/en-US/docs/Web/API/Intersection_Observer_API">Intersection Observer</a> triggered by a callback function. When positioned at the top of the page, it loads instantly; when lower, it plays as you scroll to it. This demo will only play once, requiring a page refresh for replay.
        guidance: note-transparent-video

  - id: "breadcrumbs" 
    desc: "Provides a navigational trail that helps users understand their location within a website's hierarchy."
    path: "breadcrumbs"
    title: "Breadcrumbs"
    version: "1.1.0"
    examples:

      - name: "Default Setup"
        id: "default-setup"

      - name: "Horizontal Scroll (Mobile)"
        id: "horizontal-scroll"
        guidance: a11y-scrollbars
        note: "To test the scrollable area, resize the screen to a smaller width. When designing, ensure a partial item is visible at the edge to indicate scrollability and enhance usability."
  
  - id: "card" 
    desc: "Group content such as images, text, and related links, offering a compact and organized way to display information."
    path: "card"
    title: "Card"
    version: "1.5.0"
    examples: 

      - name: "Card (Images)"
        id: "default-setup"
        guidance: 
    
          - best-practice-card
          - reminder-pseudo-element

      - name: "Card (Categories)"
        id: "card-category"

      - name: "Card (Eyebrow)"
        id: "card-eyebrow"
        note: 'Examine this markup closely and you will notice that we are using an element called <code>hgroup</code> to encapsulate the eyebrow and heading. This should be done instead of using multiple headings to markup alternative titles. See <a href="https://www.tpgi.com/subheadings-subtitles-alternative-titles-and-taglines-in-html/">Subheadings, subtitles, alternative titles and taglines in HTML</a> for more details about this useful element and best practice.'
  
      - name: "Card (Metadata)"
        id: "card-metadata"

      - name: "Card (No Summary)"
        id: "card-no-summary"
        warning: "Examine this markup closely and you will notice the absence of heading levels. This in intentional. The omission stems from the lack of a clear summary. Headings should exclusively introduce content; otherwise, they should not be used at all."
      
      - name: "Card (Video)"
        id: "card-video"
        note: 'When incorporating a video, ensure that the title explicitly includes "(Video)" to aid assistive technology users, signaling their engagement with video content. If this content is not visually desired, you may use various techniques to <a href="https://www.scottohara.me/blog/2017/04/14/inclusively-hidden.html">hide it</a>, but still make it accessible to assistive technology. Additionally, always provide captions for videos, and when needed, ensure transcripts are available. In the design of the module, we are also offsetting the play button, which often obstructs the selected images in undesirable ways.' 

      - name: "Card (No Images)"
        id: "card-no-image"

      - name: "Horizontal Card (Image)"
        id: "card-horizontal-image"

      - name: "Card Link (Link Heading)"
        id: "card-link-heading"
        note: In this example, the heading serves as the primary link, with an arrow affordance to draw attention to it instead of using a text-based call to action like <a href="#learn-more">Learn More</a>. A CSS <a href="#pseudo-element-trick">pseudo-element trick</a> makes the entire card clickable, ensuring broad usability while maintaining a unique link in each card for better accessibility. 
        best-practice: This strategy can be used by developers and CMS authors. 
        group: Linking Strategies

      - name: "Card Link (Distinct CTA)"
        id: "card-distinct"
        group: Linking Strategies
        note: In this example, the heading does not need to be the primary link because each call to action (CTA) provides distinct and unique hypertext. 
        best-practice: This strategy can be used by developers and CMS authors. While designers may not embrace this strategy due to the length of the CTA, this may be the most universal, straightforward, and accessible way to handle CTAs across a wide range of situations.

      - name: "Card Link (Visually Hidden CTA)"
        id: "card-visually-hidden"
        note: In this example, the heading does not need to be the primary link because each call to action (CTA) provides unique hypertext. However, the distinct portions of the link are visually hidden to maintain a clean appearance while still providing contextual meaning for assistive technology users.
        warning: This strategy can be used by developers but it is not recommended for CMS-authored content.
        group: Linking Strategies

      - name: "Card Link (Faux CTA)"
        id: "card-faux"
        note: In this example, the heading serves as the primary link, but the arrow affordance has been replaced with a text-based call to action (Learn More). This is often called a "Faux CTA" because it is not clickable and it is intentionally hidden from assistive technology. Like an arrow affordance, it is meant purely as a visual call to action. 
        warning: This strategy can be used by developers but it is not recommended for CMS-authored content.
        group: Linking Strategies

      - name: "Card Link (Link Heading & CTA)"
        id: "card-duplicate"
        note: In this example, both the heading and the call to action point to the same URL, with the call to action effectively hidden from assistive technology and keyboard users via <code>aria-hidden="true"</code> and <code>tabindex="-1"</code>. While this strategy is uncommon, it is considered a more <a href="https://alistapart.com/article/material-honesty-on-the-web/">materially honest</a> technique compared to many commonly used methods of linking a card. If nothing else, it can serve as a practical solution for addressing adjacent duplicate links, which can be a problem for accessibility.
        group: Linking Strategies
        warning: This strategy can be used by developers but it is not recommended for CMS-authored content.

      - name: "Card Link (Link Block)"
        id: "card-block"
        note: In this example, a hyperlink is placed around the image, heading, and content, making the entire region clickable. 
        warning: This strategy should be avoided unless the content output is known to not be excessive. Wrapping excessive amounts of content (including alternative text) within a hyperlink can overwhelm assistive technology users. This strategy, when deemed appropriate, can be used by developers but it is not recommended for CMS-authored content.
        group: Linking Strategies

      - name: "Card Link (Structural Context)"
        id: "card-structural-context"
        note:  In this example, the card interface uses list markup with nested images, headings and hyperlinks, ensuring clarity without the need for visually hidden text. This applies to cards with single or multiple links. While including visually hidden text is always recommended, content structure alone may provide sufficient context when hidden text is not possible or advisable. See WCAG <a href="https://www.w3.org/WAI/WCAG21/Techniques/html/H77">Technique H77</a> and <a href="https://www.w3.org/WAI/WCAG22/Techniques/html/H81">Technique H81</a> for more information.
        group: Linking Strategies
        best-practice: This strategy can be used by developers, with visually hidden text as recommended, and CMS authors if visually hidden text is not included.

  - id: "carousel"
    desc: "Display a series of content items, such as images or text, in a rotating or sliding manner, allowing user to cycle through them."
    path: "carousel"
    title: "Carousel"
    version: "1.0.0"
    hidden: true
    examples:

      - name: "Default Setup"
        id: "default-setup"

      - name: "Arrow Placement"
        id: "arrow-placement"

  - id: "dialog"
    desc: "An accessible, easy-to-implement modal for video and other content, replacing third-party components such as Fancybox."
    path: "dialog"
    title: "Dialog"
    version: "1.1.1"
    examples:

      - name: "Default Setup"
        id: "default"

      - name: "Kitchen Sink"
        id: "kitchen-sink"

      - name: "Insert (Fetch)"
        id: "content-fetch"
        note: "Set the <code>data-src</code> attribute to a URL followed by a <code>#fragment</code> id to fetch a same-domain page and pull in the contents of the element matching that id. Only the element's children are copied in — its own id, and any styling on the source page that targets it, doesn't come along."
        group: "Content"

      - name: "Insert (Fragment)"
        id: "content-fragment"
        note: "Set the <code>data-src</code> attribute to the id of hidden content already present elsewhere on the page to use as the dialog's content. Only the element's children are moved into the dialog."
        group: "Content"

      - name: "Insert (Iframe)"
        id: "content-iframe"
        note: "Set the <code>data-iframe-src</code> attribute to load a URL directly inside an <code>iframe</code> within the dialog, rather than fetching and extracting its content. Takes priority over <code>data-src</code> when both are present on the same trigger."
        group: "Content"

      - name: "Audio Description"
        id: "audio-description"
        a11y: "Audio descriptions aren't always necessary; they're only needed when a video conveys meaningful visual information that isn't already covered by the existing dialogue or sound, such as on-screen text, actions, or scene changes. When a video's visuals are already fully conveyed through what's said, an audio description track is unlikely to add value. When it is warranted, an audio description is delivered as a separate narration track describing that visual content during natural pauses in the audio."
        note: "Set the <code>data-audio-description</code> attribute to a <code>src, label, srclang</code> value referencing a valid, third-party or self-produced VTT file to add an audio description track to the video. For self-hosted video only, the whole attribute can instead be folded into <code>data-src</code>'s own query string (e.g. <code>video.mp4?ad=path/to/desc.vtt&label=English&srclang=en</code>); this is a fallback for when a separate attribute isn't practical, not the default approach."
        group: "Accessibility"

      - name: "Captions"
        id: "captions"
        a11y: "Please note that all videos <strong>must</strong> include captions. Even when a video has no spoken dialogue, captions are still required to describe other meaningful audio, such as music or sound effects. Captions benefit far more than the Deaf and hard-of-hearing community: most caption users aren't d/Hoh, and captions also help second-language learners, people with attention or auditory-processing differences, and anyone viewing in a sound-off environment. For more, see this <a href='https://meryl.net/captioned-videos-complete-guide/'>guide to captioned videos</a>."
        note: "Set the <code>data-caption</code> attribute to a <code>src, label, srclang, default</code> value referencing a valid VTT file. The optional <code>default</code> flag marks that track as the one shown automatically. Multiple language tracks are supported: separate each <code>src, label, srclang, default</code> group with a semicolon to add more than one caption track to the video. Third-party captions are the responsibility of their original authors to supply. To promote a more inclusive experience, third-party caption visibility defaults to on and can't be overridden. <code>label</code>/<code>srclang</code>/<code>default</code> can alternatively be given as query parameters on the VTT file's own URL (e.g. <code>file.vtt?label=English&srclang=en&default</code>) instead of comma-separated; this is a fallback for when a separate attribute isn't practical, not the default approach."
        group: "Accessibility"

      - name: "Disable Autoplay"
        id: "disable-autoplay"
        a11y: "Autoplaying video can be disorienting or distressing for users with vestibular disorders or motion sensitivity, and disruptive for anyone with attention-related conditions who is easily pulled away from the surrounding page. This attribute is already applied automatically to honor a user's OS-level settings, regardless of whether autoplay is explicitly disabled; but you can use this setting explicitly when you want autoplay disabled for every visitor, not just those with that OS-level preference set."
        note: "Set the <code>data-disable-autoplay</code> attribute (present, no value needed) to prevent the video from autoplaying when the dialog opens. The video can still be started manually using its own play control."
        group: "Accessibility"

      - name: "Description"
        id: "description"
        note: "Set the <code>data-description</code> attribute to a plain text string to use as the dialog's accessible description. The text is inserted into a hidden element referenced by <code>aria-describedby</code>, which is created when the dialog opens and removed when it closes."
        group: "Accessibility"

      - name: "Label"
        id: "label"
        note: "Set the <code>data-label</code> attribute to a descriptive string to use as the dialog's accessible name. When <code>data-enable-heading</code> is also present, this same value is also used as the visible heading text."
        reminder: "This attribute is optional when <code>data-labelledby</code> or <code>data-dynamic-label</code> is present; if neither is set, <code>data-label</code> becomes mandatory, since a dialog must always be given an accessible name through one of these three attributes."
        group: "Accessibility"

      - name: "Labelled by ID"
        id: "labelledby"
        note: "Set the <code>data-labelledby</code> attribute to a valid element <code>id</code> already present on the page to use as the dialog's accessible name, instead of an auto-generated one. This value is always used verbatim for <code>aria-labelledby</code>, taking priority over any auto-generated id. It's particularly useful in content dialog scenarios, such as the <a href='#content-fragment'>Content Insertion via Fragment</a> example, where the dialog's own content already contains a heading that can double as its accessible name."
        reminder: "This attribute is optional when <code>data-label</code> or <code>data-dynamic-label</code> is present; if neither is set, <code>data-labelledby</code> becomes mandatory, since a dialog must always be given an accessible name through one of these three attributes."
        group: "Accessibility"

      - name: "Transcript (Fragment)"
        id: "transcript-fragment"
        a11y: "Are transcripts necessary? Yes! Providing an alternative way to share a video's information through a transcript is valuable even when captions are already present: captions aren't accessible to every assistive technology, such as refreshable Braille displays or some screen readers, and they can move too quickly or feel distracting for some users. Transcripts, by contrast, let people search and scan content more easily, and can include additional detail, semantic markup, and hyperlinks that wouldn't be possible or appropriate within captions. Beyond accessibility, search engines can also benefit from this extra text, helping them better understand and index your content. For more, see this <a href='https://meryl.net/captioned-videos-complete-guide/'>guide to captioned videos</a>."
        note: "Set the <code>data-transcript-fragment</code> attribute to reference hidden content elsewhere on the page for use as the transcript. The value must match a valid element <code>id</code>; invalid or missing IDs, will prevent a transcript from loading."
        group: "Accessibility"

      - name: "Transcript (Fetch)"
        id: "transcript-fetch"
        a11y: "Are transcripts necessary? Yes! Providing an alternative way to share a video's information through a transcript is valuable even when captions are already present: captions aren't accessible to every assistive technology, such as refreshable Braille displays or some screen readers, and they can move too quickly or feel distracting for some users. Transcripts, by contrast, let people search and scan content more easily, and can include additional detail, semantic markup, and hyperlinks that wouldn't be possible or appropriate within captions. Beyond accessibility, search engines can also benefit from this extra text, helping them better understand and index your content.For more, see this <a href='https://meryl.net/captioned-videos-complete-guide/'>guide to captioned videos</a>."
        note: "Set the <code>data-transcript-fetch</code> attribute to reference an external resource and specific page fragment (<code>#id</code>), for use as the transcript source. This is especially useful in CMS environments, letting authors update the transcript without a code change. Only a valid URL, with a valid fragment when present, will be accepted. For self-hosted video only, this can instead be folded into <code>data-src</code>'s own query string (e.g. <code>video.mp4?transcript=page.html&fragment=transcript-id</code>); this is a fallback for when a separate attribute isn't practical, not the default approach."
        group: "Accessibility"

      - name: "Dynamic Label"
        id: "dynamic-label"
        note: "Set the <code>data-dynamic-label</code> attribute to fetch the dialog's accessible name automatically from the video provider, rather than authoring one by hand. This is especially useful when content is sourced dynamically and its title isn't known ahead of time, or in situations where a manually authored label has a high risk of being forgotten. Pairing it with a <code>data-dynamic-alt</code> attribute on an inner <code>img</code> is optional, but recommended: once the label resolves, its value is also applied to that image's <code>alt</code> text. Additional functional text, such as <em>(Video)</em>, is dynamically added to allow users to understand the nature of the button and the dialog."
        reminder: "This attribute is optional when <code>data-label</code> or <code>data-labelledby</code> is present; if neither is set, <code>data-dynamic-label</code> becomes mandatory, since a dialog must always be given an accessible name through one of these three attributes. Please also note that dynamic labeling is only supported for YouTube and Vimeo."
        group: "Experimental"

      - name: "ARIA Dialog"
        id: "aria-dialog"
        note: "By default, the component loads only the <code>dialog</code> element. This fallback is provided in the event that the <code>dialog</code> element causes compatibility or rendering issues. For example, absolutely positioned elements that need to render within the dialog may otherwise be positioned behind it due to stacking context of the <code>dialog</code> element."
        group: "Utilities"

      - name: "Class"
        id: "class"
        note: "Set the <code>data-class</code> attribute to append one or more space-separated class names to the dialog element, alongside its default <code>dialog</code> class."
        customcss: class
        group: "Utilities"

      - name: "Enable Heading"
        id: "enable-heading"
        note: "By default, dialogs do not render a heading. Set the <code>data-enable-heading</code> attribute to enable one, using the required value provided via the <code>data-label</code> attribute. Note that an <code>h1</code> element is used for this heading; this is acceptable within the context of a dialog, since all other page content is rendered <code>inert</code> while it is open."
        group: "Utilities"

      - name: "Fullscreen"
        id: "fullscreen"
        group: "Utilities"

      - name: "Play Button (Trigger)"
        id: "play-button"
        best-practice: "It is considered good practice to always add a border to your play button, as this helps prevent it from becoming lost against a light background. Pairing a darker border with a light button background color (or vice versa) ensures a greater chance that the button remains visible over both lighter and darker background imagery."
        note: "Play buttons are often implemented redundantly, adding extra text for assistive technology users that could already be conveyed through a well-written <code>alt</code> value on the image the button wraps. Setting the <code>data-play-button</code> attribute handles this automatically, adding a visual play-button indicator without requiring redundant markup or text, treating is a visual cue only."
        group: "Utilities"

      - name: "Poster"
        id: "poster"
        note: "Set the <code>data-poster</code> attribute to an image URL to use as the video's poster frame, shown before playback starts. Only applies to self-hosted video (mp4/webm/ogv); other types don't render a native <code>video</code> element to apply it to."
        group: "Utilities"

      - name: "Brightcove"
        id: "video-brightcove"
        group: "Video Support"

      - name: "Cloudflare"
        id: "video-cloudflare"
        group: "Video Support"

      - name: "MP4"
        id: "video-mp4"
        group: "Video Support"

      - name: "Vimeo"
        id: "video-vimeo"
        group: "Video Support"

      - name: "WebM"
        id: "video-webm"
        group: "Video Support"

      - name: "YouTube Shorts"
        id: "video-youtube-shorts"
        note: "The script automatically detects when a YouTube Shorts video is being played and adjusts its default size to render at the correct aspect ratio."
        group: "Video Support"

      - name: "YouTube"
        id: "video-youtube"
        group: "Video Support"

  - id: "disclosure"
    desc: "Reaveal or hide additional content when triggered, helping to manage the display of supplementary information."
    message: disclosure-use
    path: "disclosure"
    title: "Disclosure"
    version: "2.4.2"
    examples:

      - name: "Default Setup"
        id: "default-setup"

      - name: "Animation"
        id: "animation"
        message: starting-style

      - name: "Default Opened"
        id: "default-opened"

      - name: "Enable Anchor"
        id: "enable-anchor"
        note: "In this demo, selecting a disclosure appends its configured anchor to the URL. Anchors can be useful for tracking interactions and creating links that navigate directly to specific content."

      - name: "Interactive Heading"
        id: "heading"

      - name: "Persistent State"
        id: "persistent"
        note: Reduce your screen size to reveal the disclosure button. In some cases, we may only require a discosure to be present on mobile, but not on desktop. 
        message: button-removal

      - name: "Viewport Context"
        id: "viewport-context"
        note: "In some scenarios, we may only want the disclosure to be present on smaller viewports. In such cases, it is crucial to ensure that accessibility on larger screens is not compromised by leaving buttons accessible to assistive technologies. To see this solution in action, try pressing or tabbing to the headings in larger viewport sizes. As you'll notice, the headings are not interactive and all content that would normally be collapsed is revealed, which is exactly what we want. However, when you change the viewport to a smaller size, the component then becomes a traditional accordion. This kind of behavior can often be found in the footer of applications or website, where space is more limited on smaller screens."
        message: button-removal

  - id: "hero-banner" 
    desc: "Highlight key content or messaging with a bold visual, featuring an image, heading, and call-to-action at the top of a page."
    message: picture-element
    path: "hero-banner"
    title: "Hero Banner (Image)"
    version: "1.1.0"
    examples:

      - name: "Text Left Top"
        id: "text-left-top"

      - name: "Text Left Top (Constrain)"
        id: "text-left-top-constrain"
        group: "Constrain"

      - name: "Text Left Center"
        id: "text-left-center"

      - name: "Text Left Center (Constrain)"
        id: "text-left-center-constrain"
        group: "Constrain"

      - name: "Text Left Bottom"
        id: "text-left-bottom"

      - name: "Text Left Bottom (Constrain)"
        id: "text-left-bottom-constrain"
        group: "Constrain"

      - name: "Text Center Top"
