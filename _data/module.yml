        id: "arrow-placement"

  - id: "dialog"
    desc: "An accessible, easy-to-implement modal for video and other content, replacing third-party components such as Fancybox."
    path: "dialog"
    title: "Dialog"
    version: "1.2.3"
    examples:

      - name: "Default Setup"
        id: "default"
        a11y: "To ensure better accessibility, dialog labeling is strictly enforced by the script, and content will not load unless one of the supported labeling methods is used: <a href='#label'>Label</a>, <a href='#labelledby'>Label by ID</a>, or <a href='#dynamic-label'>Dynamic Label</a>. A modal dialog's label should describe its overall content."
        reminder: "All features can be used with either a button or a hyperlink. The hyperlink uses <code>href</code> instead of <code>data-src</code>, providing a fallback to a user-friendly alternative if the script fails or is disrupted. An <code>href</code> attribute will not work on a <code>button</code> element."

      - name: "Kitchen Sink"
        id: "kitchen-sink"
        note: "This example showcases most of the features available in this component. While some are visually apparent, others work behind the scenes to benefit users with disabilities."

      - name: "Insert (Fetch)"
        id: "content-fetch"
        best-practice: "This may be useful in a CMS environment, where an author cannot directly edit the contents of a dialog."
        note: "Set the <code>data-src</code> attribute to a URL followed by a <code>#fragment</code> identifier to fetch content from a same-domain page and insert the children of the element matching that identifier. The source element's own ID and any styles on the source page that specifically target it are not preserved."
        group: "Content"

      - name: "Insert (Fragment)"
        id: "content-fragment"
        note: "Set the <code>data-src</code> attribute to the ID of hidden content elsewhere on the page to use as the dialog's content. The source element's own ID and any styles that specifically target it are not preserved."
        group: "Content"

      - name: "Insert (Iframe)"
        id: "content-iframe"
        note: "Set the <code>data-iframe-src</code> attribute to load a URL directly into an <code>iframe</code> within the dialog. Takes precedence over <code>data-src</code>."
        group: "Content"

      - name: "Audio Description"
        id: "audio-description"
        a11y: "Audio descriptions are only necessary when meaningful visual information, such as on-screen text, actions, or scene changes, isn't conveyed through existing dialogue or sound. When needed, they provide a separate narration track that describes this content during natural pauses in the audio."
        note: "Set the <code>data-audio-description</code> attribute to a <code>src, label, srclang</code> value referencing a valid third-party or self-produced VTT file to add an audio description track. For self-hosted video, these parameters can alternatively be included in the <code>data-src</code> query string (e.g., <code>video.mp4?src=file.vtt&label=English&srclang=en</code>). Use this approach only when a separate attribute isn't practical."
        group: "Accessibility"

      - name: "Captions"
        id: "captions"
        a11y: "All videos <strong>must</strong> include captions, even those without dialogue, to convey meaningful audio such as music and sound effects. Captions benefit everyone, including second-language learners, people with attention or auditory-processing differences, and viewers watching without sound. For details, see this <a href='https://meryl.net/captioned-videos-complete-guide/'>guide to captioned videos</a>. Videos that are missing captions will result in a console warning and reminder."
        note: "Set the <code>data-caption</code> attribute to a <code>src, label, srclang, default</code>. The optional (but strongly recommended) <code>default</code> flag displays the captions automatically. Multiple caption tracks are supported by separating each group with a semicolon (e.g., <code>src, label, srclang, default; src, label, srclang</code>). Alternatively, <code>label</code>, <code>srclang</code>, and <code>default</code> can be specified as query parameters on the VTT URL (e.g., <code>english.vtt?label=English&srclang=en&default; french.vtt?label=Français&srclang=fr</code>) when a separate attribute isn't practical."
        group: "Accessibility"

      - name: "Disable Autoplay"
        id: "disable-autoplay"
        a11y: "Autoplaying video can disorient users with vestibular disorders or motion sensitivity, distract users with attention-related conditions, and interfere with screen reader use, do disabling them is often recommended, though not mandatory in WCAG. However, the dialog component automatically respects OS-level motion preferences and all video wil be paused by default under these conditions."
        note: "Set the <code>data-disable-autoplay</code> attribute to prevent the video from autoplaying when the dialog opens. The video can still be started manually using its own play control."
        group: "Accessibility"

      - name: "Description"
        id: "description"
        a11y: "This text is exposed only to assistive technology users, and is only meant to act as supplementary information. Keep it to one or two sentences that provide context beyond the dialog's name, rather than repeating its label or heading, which screen readers announce first."
        note: "Set the <code>data-description</code> attribute to a plain text string to use as the dialog's accessible description. The text is inserted into a hidden element referenced by <code>aria-describedby</code>."
        group: "Accessibility"

      - name: "Label"
        id: "label"
        note: "Set the <code>data-label</code> attribute to a descriptive string to define the dialog's accessible name. If <code>data-enable-heading</code> is present, this value will serve as the visible heading and accessible name."
        reminder: "This attribute is optional when <code>data-labelledby</code> or <code>data-dynamic-label</code> is present. Otherwise, <code>data-label</code> is required to provide the dialog with an accessible name. At least one of these three attributes must be set."
        group: "Accessibility"

      - name: "Label by ID"
        id: "labelledby"
        note: "Set <code>data-labelledby</code> to the <code>id</code> of existing or fetched page element to use to use as the dialog's accessible name. The value is applied directly to <code>aria-labelledby</code>. The attribute also accepts a space-separated list of <code>id</code> values to combine multiple labels."
        reminder: "This attribute is optional when <code>data-label</code> or <code>data-dynamic-label</code> is present. Otherwise, <code>data-labelledy</code> is required to provide the dialog with an accessible name. At least one of these three attributes must be set."
        group: "Accessibility"

      - name: "Transcript (Fragment)"
        id: "transcript-fragment"
        note: "Set the <code>data-transcript-fragment</code> attribute to the ID of hidden content elsewhere on the page to use as the transcript's content. The source element's own ID and any styles that specifically target it are not preserved."
        guidance: a11y-transcripts
        group: "Accessibility"

      - name: "Transcript (Fetch)"
        id: "transcript-fetch"
        best-practice: "This may be useful in a CMS environment, where an author cannot directly edit the contents of a transcript."
        guidance: a11y-transcripts
        note: "Set the <code>data-transcript-fetch</code> attribute to a URL followed by a <code>#fragment</code> identifier to fetch content from a same-domain page and insert the children of the element matching that identifier. The source element's own ID and any styles on the source page that specifically target it are not preserved."
        group: "Accessibility"

      - name: "Dynamic Label & Alternative Text"
        id: "dynamic-label"
        message: experimental
        note: "Set <code>data-dynamic-label</code> to retrieve the dialog's accessible name automatically from the video provider (YouTube and Vimeo only). This may be useful in CMS authoring environment and when manually authored labels and alternative text may be overlooked, which is common occurance in web development. Optionally, add <code>data-dynamic-alt</code> to an inner <code>img</code> to apply the resolved label to its <code>alt</code> text. Additional functional text, such as (Video), is added automatically to clarify the purpose of the trigger and dialog."
        reminder: "This attribute is optional when data-label or data-labelledy is present. Otherwise, data-dynamic-label is required to provide the dialog with an accessible name. At least one of these three attributes must be set."
        group: "Experimental"

      - name: "ARIA Dialog"
        id: "aria-dialog"
        note: "By default, the component loads only the <code>dialog</code> element. This fallback is available if the element causes compatibility or rendering issues. For example, absolutely positioned elements may render behind the dialog due to its stacking context."
        group: "Utilities"

      - name: "Class"
        id: "class"
        note: "Set <code>data-class</code> to append one or more space-separated class names to the dialog element, alongside the default <code>dialog</code> class."
        customcss: class
        group: "Utilities"

      - name: "Enable Heading"
        id: "enable-heading"
        note: "By default, dialogs do not display a heading. Set <code>data-enable-heading</code> to enable one, using the required value from <code>data-label</code>. The heading uses an <code>h1</code> element, which is appropriate because all other page content is made <code>inert</code> while the dialog is open."
        group: "Utilities"

      - name: "Fullscreen"
        id: "fullscreen"
        note: "Add the <code>data-fullscreen</code> attribute (no value required) to expand the dialog's media to fill the viewport width."
        group: "Utilities"

      - name: "Play Button (Trigger)"
        id: "play-button"
        best-practice: "Always add a contrasting border to the play button to keep it visible against varied backgrounds. Pair a dark border with a light button background, or vice versa, to maintain visibility over both light and dark imagery."
        note: "Play buttons often duplicate information already conveyed by the wrapped image's <code>alt</code> text. Add <code>data-play-button</code> to display a visual play indicator without redundant markup or assistive technology announcements. The indicator serves as a visual cue only."
        group: "Utilities"

      - name: "Poster"
        id: "poster"
        note: "Set <code>data-poster</code> to an image URL to display as the video's poster frame before playback begins. This attribute applies only to self-hosted video formats (MP4, WebM, OGV) that use a native <code>video</code> element."
        group: "Utilities"

      - name: "Brightcove"
        id: "video-brightcove"
        group: "Video Support"

      - name: "Cloudflare"
        id: "video-cloudflare"
        group: "Video Support"

      - name: "MP4"
        id: "video-mp4"
        group: "Video Support"

      - name: "Vimeo"
        id: "video-vimeo"
        group: "Video Support"

      - name: "WebM"
        id: "video-webm"
        group: "Video Support"

      - name: "YouTube Shorts"
        id: "video-youtube-shorts"
        group: "Video Support"

      - name: "YouTube"
        id: "video-youtube"
        group: "Video Support"

